<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validated ATT&amp;CK Chain</title><style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101c2e;--text:#e8eef8;--muted:#91a3ba;--auth:#4cc9f0;--advisory:#80ed99;--llm:#f7b267}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142440,var(--bg) 55%);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:28px}header{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:28px}p{color:var(--muted)}
form{display:flex;gap:8px}input,button{border:1px solid #405473;border-radius:8px;padding:10px 13px;background:#0b1728;color:var(--text)}button{cursor:pointer;background:#183a61}
.legend{display:flex;gap:18px;margin:20px 0;flex-wrap:wrap}.key:before{content:"";display:inline-block;width:24px;border-top:3px solid;margin-right:7px;vertical-align:middle}
.auth:before{border-color:var(--auth)}.advisory:before{border-color:var(--advisory);border-top-style:dashed}.llm:before{border-color:var(--llm);border-top-style:dotted}
#status{min-height:22px}.graph{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:18px;align-items:start;overflow:auto;padding:12px 2px 30px}
.column h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.node{position:relative;background:var(--panel);border:1px solid #334861;border-left:5px solid var(--auth);border-radius:10px;padding:12px;margin:12px 0;min-height:70px;box-shadow:0 8px 22px #03091466}
.node.advisory-derived{border-left-color:var(--advisory)}.node.llm-inferred{border-left-color:var(--llm)}.node:not(.last):after{content:"→";position:absolute;right:-18px;top:22px;color:#71849e;font-size:18px}
.label{font-weight:700}.meta{color:var(--muted);font-size:12px;margin-top:5px}.confidence{font-variant-numeric:tabular-nums}details{margin-top:9px}summary{cursor:pointer;color:#b7cae2}.evidence{word-break:break-word;color:#9fe7b0}
.empty{grid-column:1/-1;padding:50px;border:1px dashed #405473;border-radius:12px;text-align:center;color:var(--muted)}@media(max-width:900px){.graph{grid-template-columns:1fr}.node:not(.last):after{content:"↓";right:14px;top:auto;bottom:-22px}}
</style></head><body><main><header><div><h1>Validated ATT&amp;CK Chain</h1><p>Evidence provenance and validation at every step.</p></div>
<form id="lookup"><input id="cve" value="CVE-2026-22306" pattern="CVE-[0-9]{4}-[0-9]{4,}" required><button>Load stored analysis</button></form></header>
<div class="legend"><span class="key auth">Authoritative taxonomy</span><span class="key advisory">Advisory-derived behavior</span><span class="key llm">Validated LLM mapping</span></div>
<div id="status"></div><section id="graph" class="graph"><div class="empty">Enter a CVE with a stored analysis.</div></section></main><script>
const order=['cve','cwe','capec','exploit_step','attack_technique','attack_tactic'];const titles={cve:'CVE',cwe:'CWE',capec:'CAPEC',exploit_step:'Exploit steps',attack_technique:'ATT&CK technique',attack_tactic:'ATT&CK tactic'};
const esc=v=>String(v??'');function card(n,last){const p=n.properties||{},step=n.type==='exploit_step',div=document.createElement('article');div.className=`node ${n.provenance.replace('_','-')} ${last?'last':''}`;
const label=document.createElement('div');label.className='label';label.textContent=n.label;div.append(label);if(step){const meta=document.createElement('div');meta.className='meta confidence';meta.textContent=`${p.mitre_technique_id||'No technique'} · ${p.mitre_tactic_id||'No tactic'} · confidence ${Number(p.confidence||0).toFixed(2)} · ${p.validation_status}`;div.append(meta);
const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Reasoning and evidence';details.append(summary);const reason=document.createElement('p');reason.textContent=esc(p.reasoning);details.append(reason);(p.evidence_sources||[]).forEach(url=>{const source=document.createElement('div');source.className='evidence';source.textContent=url;details.append(source)});div.append(details)}else if(p.name||p.description){const meta=document.createElement('div');meta.className='meta';meta.textContent=p.name||p.description;div.append(meta)}return div}
function render(data){const root=document.querySelector('#graph');root.replaceChildren();order.forEach((type,index)=>{const col=document.createElement('div');col.className='column';const h=document.createElement('h2');h.textContent=titles[type];col.append(h);data.nodes.filter(n=>n.type===type).forEach(n=>col.append(card(n,index===order.length-1)));root.append(col)})}
document.querySelector('#lookup').addEventListener('submit',async e=>{e.preventDefault();const id=document.querySelector('#cve').value.toUpperCase(),status=document.querySelector('#status');status.textContent='Loading…';try{const response=await fetch(`/api/cve-analysis/${encodeURIComponent(id)}/graph`);if(!response.ok)throw new Error((await response.json()).detail||response.statusText);render(await response.json());status.textContent=''}catch(error){status.textContent=`Unable to load graph: ${error.message}`}});
</script></body></html>
